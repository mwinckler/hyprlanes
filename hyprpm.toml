[repository]
name = "hyprlanes"
authors = ["Matt Winckler"]

[hyprlanes]
description = "Independent horizontal scrolling lanes on a vertically scrolling workspace."
authors = ["Matt Winckler"]
output = "build/hyprlanes.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build -j 2",
]
